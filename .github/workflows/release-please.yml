name: Release Please

# 自动维护 version / CHANGELOG / tag / GitHub Release。
# 提交走 Conventional Commits（feat:/fix:/docs:/ci:…）即可触发：
# - 每个合并到 main 的 commit 会被收集到"待发布"清单
# - 它每周自动开（或更新）一个 Release PR
# - PR 合并后：自动打 tag、创建 GitHub Release，然后触发 publish.yml 发 npm
# 想跳版本号或回滚：close 这个 PR 并评论 /autorelease:skip 或 /autorelease:major/minor。
# 完整协议见 https://github.com/googleapis/release-please/blob/main/docs/cli.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 用 personal PAT（cs vault: secret://github/personal-pat，仓库 secret 名 PR_PAT），
          # 而不是默认 GITHUB_TOKEN —— 后者要仓库额外勾
          # "Allow GitHub Actions to create and approve pull requests" 才开得了 PR，
          # 少这一步整条链路就不动。
          token: ${{ secrets.PR_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: false

  # 给 release-please 开出来的 PR 自动挂 auto-merge。
  #
  # ⚠️ 为什么需要这个 job：release-please 只负责「开 PR」，合并那一步设计上要人点。
  #   仓库的 allow_auto_merge 已开，这里在 PR 出来后主动去启用，条件满足即自动合并 ——
  #   这一步做完，日常发版零人工。仍然会等 branch protection 要求的 check 通过才合：
  #   「合并不需要人」不等于「合并不需要门」。
  #
  # 靠 head ref 前缀筛（release-please--），不硬编码完整分支名 —— 组件名、
  # include-component-in-tag 都会影响它生成的分支名，写死等于埋雷。
  # 找不到 PR 就安静退出：这个 workflow 在「没有待发布内容」时也会跑。
  auto-merge:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: 对 release PR 启用 auto-merge
        uses: actions/github-script@v7
        with:
          # ⚠️ 必须用 PR_PAT，不能用默认 GITHUB_TOKEN。
          #   enablePullRequestAutoMerge 是「以用户身份」执行的 GraphQL mutation，
          #   GitHub App token 调它会拿到 "Resource not accessible by integration" ——
          #   workflow 报 success、日志里一条 warning，PR 上 autoMergeRequest 却是 null。
          github-token: ${{ secrets.PR_PAT }}
          script: |
            // ⚠️ pulls.list 的 head 参数是**精确匹配**（`user:ref`），不是前缀匹配。
            //   写成 `owner:release-please--` 匹配不到
            //   `release-please--branches--main--components--<name>`，
            //   列表会返回空 —— 实测踩过一次，日志安静地打「没有待处理的 release PR」。
            //   所以这里拉全量开放 PR，在 JS 里按 ref 前缀筛。
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            })
            const releasePrs = prs.filter((pr) => pr.head.ref.startsWith('release-please--'))
            if (releasePrs.length === 0) {
              core.info(`开放 PR ${prs.length} 个，其中 release PR 0 个 —— 本次推送没有可发布内容`)
              return
            }
            // ⚠️ 启用 auto-merge **只有 GraphQL 接口**，REST 里没有对应端点 ——
            //   写 github.rest.pulls.enablePullRequestAutoMerge 会得到
            //   "is not a function"。而且它吃的是 PR 的 node_id，不是 PR 号。
            const mutation = `mutation ($prId: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: SQUASH }) {
                clientMutationId
              }
            }`
            // ⚠️ **必须等 check 跑完再挂**。GitHub 拒绝对「unstable」的 PR 启用
            //   auto-merge（返回 "Pull request is in unstable status"）。
            //   而 release-please 一开 PR，这个 job 就立刻启动 —— CI 那时必然还在跑。
            //
            //   但**不是等所有 check**：仓库里还挂着第三方审查 agent（Cursor 的
            //   Security Reviewer / Approval Router），它们能挂 in_progress 好几分钟，
            //   却不属于 branch protection 要求的检查 —— 等它们会把发版卡死
            //   （实测 bloom #47 在这里空等了 15 分钟）。
            //   所以只做「短暂等待」，真正的把关交给下面的 mergeable_state。
            const PENDING = new Set(['queued', 'in_progress', 'pending', 'waiting'])
            async function waitForChecks(pr) {
              const deadline = Date.now() + 5 * 60 * 1000
              while (Date.now() < deadline) {
                const { data } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                  per_page: 100
                })
                const running = data.check_runs.filter((r) => PENDING.has(r.status))
                if (running.length === 0) return true
                core.info(`#${pr.number} 还有 ${running.length} 个 check 在跑（${running.map((r) => r.name).join(', ')}），等 20s`)
                await new Promise((resolve) => setTimeout(resolve, 20000))
              }
              core.info(`#${pr.number} 仍有 check 在跑，继续往下走 —— 由 mergeable_state 判门`)
              return false
            }
            /** 没通过的 check 名（NEUTRAL/SKIPPED 视为通过）。 */
            async function failingChecks(pr) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100
              })
              return data.check_runs
                .filter((r) => !['success', 'neutral', 'skipped'].includes(r.conclusion))
                .map((r) => `${r.name}:${r.conclusion}`)
            }
            /**
             * 轮询 mergeable_state 直到它脱离 unknown。
             * 它是异步算的，刚推完那一刻读出来是 unknown；直接拿 unknown 当「不能合」
             * 就放弃，等于把「还没算出来」和「确实不能合」混为一谈。
             */
            async function readState(pr, tries) {
              let fresh = null
              for (let i = 0; i < tries; i++) {
                const res = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                })
                fresh = res.data
                if (fresh.mergeable_state !== 'unknown') return fresh
                core.info(`#${pr.number} mergeable_state 还是 unknown，等 10s 重读`)
                await new Promise((resolve) => setTimeout(resolve, 10000))
              }
              return fresh
            }
            for (const pr of releasePrs) {
              core.info(`对 #${pr.number} 启用 auto-merge: ${pr.title}`)
              await waitForChecks(pr)

              const failed = await failingChecks(pr)
              if (failed.length > 0) {
                core.warning(`#${pr.number} 有 check 没通过（${failed.join(', ')}），不自动合并`)
                continue
              }

              // **mergeable_state === 'clean' 才是本 workflow 真正的门**：
              // 它已经把 branch protection 的要求（必需 check、必需 review、
              // 未解决对话）全算进去了。所以先试原生 auto-merge，不成就以它为准。
              let fresh = await readState(pr, 5)
              if (!fresh || fresh.mergeable_state === 'clean') {
                try {
                  await github.graphql(mutation, { prId: pr.node_id })
                  core.info(`#${pr.number} 已挂上 auto-merge，交给 GitHub 合`)
                  continue
                } catch (err) {
                  core.info(`#${pr.number} 挂原生 auto-merge 未成功（${err.message}），改走直接合并`)
                }
              }

              if (!fresh || fresh.mergeable_state === 'unknown') {
                fresh = await readState(pr, 10)
              }
              if (!fresh || fresh.mergeable_state !== 'clean') {
                core.warning(
                  `#${pr.number} 状态是 ${fresh ? fresh.mergeable_state : '读不到'}，不自动合并 —— 需要人看一眼`
                )
                continue
              }
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              })
              core.info(`#${pr.number} 已自动合并`)
            }
