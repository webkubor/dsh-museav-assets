# dsh-museav-assets bundle patch：把资产台插入 web profile。
#
# 作为 dsh.bundle.patch 被 dsh 加载器消费。insert 引用本包，加载器从 profile 的
# node_modules 解析它并挂成 Cordis 插件。
# 不写 config = 用插件 Config 默认值（见 lib/index.js export const Config）。
# ⚠️ id 与 name 都必须加引号：包名带 scope 后以 `@` 开头，而 `@` 是 YAML 保留
# 起始字符，不加引号整个文件会解析失败（"bad indentation of a mapping entry"）。
# 2026-10-02 0.1.1 实际炸过一次：包名迁 scope 时只给 name 加了引号、漏了 id，
# 于是 dsh 拒绝安装该包 —— 症状是「装上就报 Cannot validate installed package」，
# 而报错落在 cordis.patch.yml 的解析上，看着像配置写错，其实是包名没引用。
- insert:
    # 插件只暴露 4 条只读/轻写路由，全部 fail-open：CLI 没装、没登录、出错都回
    # {ok:false,error}，不影响 boot graph。
    - id: '@dsh-plugins/dsh-museav-assets'
      name: '@dsh-plugins/dsh-museav-assets'
